# nginx vhost for eproc2text.duque.cloud (static SPA, no backend).
# Installed by deploy/remote-install.sh as /etc/nginx/sites-available/eproc2text.duque.cloud.
# Isolated by server_name: touches no global nginx setting and no other site on the VPS.
#
# nginx drops server-level add_header directives in any location that declares its own,
# so the security headers are repeated in every location below. COOP/COEP mirror netlify.toml.

server {
    listen 80;
    listen [::]:80;
    server_name eproc2text.duque.cloud;

    # Let's Encrypt renewal (certbot --webroot) must keep working over plain HTTP
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/eproc2text/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eproc2text.duque.cloud;

    ssl_certificate /etc/letsencrypt/live/eproc2text.duque.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eproc2text.duque.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/eproc2text.duque.cloud.access.log;
    error_log /var/log/nginx/eproc2text.duque.cloud.error.log warn;

    root /var/www/eproc2text/html;
    index index.html;

    # Everything runs in the browser; nothing is uploaded to the server
    client_max_body_size 1M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json
        application/wasm image/svg+xml;

    # Hashed Vite assets: cache forever; a missing asset is a 404, never index.html
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html and SPA fallback: always revalidate so a new deploy shows up on refresh
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
